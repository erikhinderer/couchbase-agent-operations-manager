<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Couchbase Agent Operations Manager</title>
    <script>
      // Sets data-theme before first paint so there's no flash of the
      // wrong theme. Light is the default look - only dark needs to be
      // requested explicitly. Keep the storage key and fallback logic
      // in sync with ui/src/store/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("agent-operations-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
