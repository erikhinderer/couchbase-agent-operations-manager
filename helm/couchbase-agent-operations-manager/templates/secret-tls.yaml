{{- if eq .Values.tls.mode "generated" }}
{{- $secretName := include "aom.tlsSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
# Self-signed certificate shared by operations-manager (:8090) and ui
# (:443) - see the long comment on `tls` in values.yaml for why this is
# a generated Secret rather than docker-compose.yml's shared read-write
# volume. Generated once, then read back from the cluster on every
# subsequent `helm upgrade` (the `lookup` above) so it stays stable
# instead of rotating (and re-triggering browser trust warnings) on
# every release. `helm template`/`--dry-run` always regenerate, since
# `lookup` has no live cluster to query in that mode - expected, not a bug.
{{- if $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "aom.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
{{- else }}
{{- $cert := genSelfSignedCert (first .Values.tls.generated.dnsNames) nil .Values.tls.generated.dnsNames (.Values.tls.generated.days | int) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "aom.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
