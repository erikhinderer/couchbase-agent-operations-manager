services:
  # ---------------------------------------------------------------------
  # Couchbase Server - the appliance's tool registry, RBAC identity table,
  # and audit log. Enterprise Edition is required (not a preference): RBAC
  # pre-filtering combined with vector kNN search inside a single Couchbase
  # Search (FTS) request depends on vector-typed index fields, which
  # Couchbase Community Edition rejects outright. Enterprise Edition's
  # Docker image is free to run for development/testing under Couchbase's
  # standard license - no key or account needed for this use case.
  # ---------------------------------------------------------------------
  couchbase:
    image: couchbase:enterprise-7.6.2
    container_name: agent-operations-couchbase
    restart: unless-stopped
    ports:
      - "8091-8096:8091-8096"
      - "11210:11210"
    volumes:
      - couchbase-data:/opt/couchbase/var
    healthcheck:
      # No `-f`: this Couchbase Server version returns 401 on the
      # unauthenticated /pools endpoint, which curl -f treats as a hard
      # failure even when the server is perfectly healthy.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8091/pools"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  couchbase-init:
    image: couchbase:enterprise-7.6.2
    container_name: agent-operations-couchbase-init
    depends_on:
      couchbase:
        condition: service_healthy
    volumes:
      - ./couchbase-init/init.sh:/init.sh:ro
    environment:
      COUCHBASE_USERNAME: ${COUCHBASE_USERNAME:-Administrator}
      COUCHBASE_PASSWORD: ${COUCHBASE_PASSWORD:-CouchbaseDemo123!}
      COUCHBASE_BUCKET: ${COUCHBASE_BUCKET:-agent_operations}
      COUCHBASE_SCOPE: ${COUCHBASE_SCOPE:-agent_operations}
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: on-failure:3

  # ---------------------------------------------------------------------
  # Bundled sample MCP tool servers (jira/zendesk/snowflake, plus an
  # intentionally-unregistered shadow-diagnostics server) so the appliance
  # is testable immediately. Point the Servers page at your own real MCP
  # endpoints whenever you're ready - this container is optional and can
  # be removed once you no longer need the samples.
  # ---------------------------------------------------------------------
  sample-mcp-servers:
    build:
      context: ./sample-mcp-servers
    container_name: agent-operations-sample-servers
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  # ---------------------------------------------------------------------
  # THE APPLIANCE ITSELF: the Couchbase Agent Operations Manager. Authenticates
  # callers, resolves them to an RBAC role, ingests only explicitly
  # registered/trusted MCP servers' tool catalogs into Couchbase with
  # embeddings + allowed_roles + trust_status, answers tool-discovery
  # requests with a single Couchbase Search request that combines a vector
  # kNN query with an RBAC term-query pre-filter, re-checks authorization
  # before proxying any tool call to its real downstream MCP server, and
  # writes every decision to an append-only audit log in Couchbase.
  # ---------------------------------------------------------------------
  operations-manager:
    build:
      context: ./operations-manager
    container_name: agent-operations-manager
    restart: unless-stopped
    depends_on:
      couchbase:
        condition: service_healthy
      # couchbase-init is a one-shot provisioning container (creates the
      # bucket/scope/collections operations-manager writes to on startup, e.g.
      # the identities collection it seeds API keys into). Waiting only for
      # it to *start* - the old plain-list form of depends_on - let
      # operations-manager race it and crash with ScopeNotFoundException before
      # the scope existed. service_completed_successfully blocks
      # operations-manager from starting at all until that script has actually
      # finished (exit code 0).
      couchbase-init:
        condition: service_completed_successfully
      sample-mcp-servers:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      HOST: 0.0.0.0
      PORT: 8090
      APPLIANCE_NAME: ${APPLIANCE_NAME:-Couchbase Agent Operations Manager}
      COUCHBASE_CONNECTION_STRING: couchbase://couchbase
      COUCHBASE_USERNAME: ${COUCHBASE_USERNAME:-Administrator}
      COUCHBASE_PASSWORD: ${COUCHBASE_PASSWORD:-CouchbaseDemo123!}
      COUCHBASE_BUCKET: ${COUCHBASE_BUCKET:-agent_operations}
      COUCHBASE_SCOPE: ${COUCHBASE_SCOPE:-agent_operations}
      COUCHBASE_SEARCH_HOST: couchbase
      SAMPLE_MCP_SERVERS_BASE_URL: http://sample-mcp-servers:8100
      API_KEY_SUPPORT_AGENT: ${API_KEY_SUPPORT_AGENT:-demo-support-agent-9f21}
      API_KEY_FINANCE_ANALYST: ${API_KEY_FINANCE_ANALYST:-demo-finance-analyst-7e83}
      API_KEY_ADMIN: ${API_KEY_ADMIN:-demo-admin-4c56}
      AUDIT_LOG_RETENTION_HOURS: ${AUDIT_LOG_RETENTION_HOURS:-720}
      HIJACK_SCAN_INTERVAL_MINUTES: ${HIJACK_SCAN_INTERVAL_MINUTES:-5}
      HIJACK_CHAIN_WINDOW_SECONDS: ${HIJACK_CHAIN_WINDOW_SECONDS:-120}
      # Local dashboard login (see operations-manager/app/user_auth.py).
      # start.sh generates a random AUTH_SECRET_KEY into .env on first run.
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-12}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      # Serves HTTPS by default on :8090 using a self-signed cert baked into
      # the image at build time (operations-manager/Dockerfile) - see
      # docker-entrypoint.sh. Mount your own cert/key over
      # operations-manager/tls/server.{crt,key} for a real deployment
      # (uncomment the volume mount below). DISABLE_TLS=true falls back to
      # plain HTTP - if you set that, also set OPERATIONS_MANAGER_SCHEME=http
      # on the `ui` service below so its proxy hop still matches.
      DISABLE_TLS: ${DISABLE_TLS:-false}
      # LLM response caching for agents. Every provider key is optional -
      # without one, a cache miss is answered by a labelled offline stub so
      # the feature is demoable with no egress.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_CACHE_ENABLED: ${LLM_CACHE_ENABLED:-true}
      LLM_CACHE_PROVIDER: ${LLM_CACHE_PROVIDER:-anthropic}
      LLM_CACHE_MODEL: ${LLM_CACHE_MODEL:-claude-sonnet-4-5}
      LLM_CACHE_TTL_SECONDS: ${LLM_CACHE_TTL_SECONDS:-3600}
      LLM_CACHE_MAX_ENTRIES: ${LLM_CACHE_MAX_ENTRIES:-5000}
      LLM_CACHE_SEMANTIC_ENABLED: ${LLM_CACHE_SEMANTIC_ENABLED:-true}
      LLM_CACHE_SIMILARITY_THRESHOLD: ${LLM_CACHE_SIMILARITY_THRESHOLD:-0.94}
      LLM_CACHE_LOG_RETENTION_HOURS: ${LLM_CACHE_LOG_RETENTION_HOURS:-720}
      LOG_LEVEL: INFO
    volumes:
      - hf-cache:/root/.cache/huggingface
      # HTTPS certificate storage, shared with the `ui` service's
      # /etc/nginx/tls below - one certificate, installed once, serves
      # both the API and the dashboard. Starts out populated with the
      # baked-in self-signed fallback (Docker copies the image's existing
      # /app/tls into this volume the first time it's used, since the
      # volume starts empty) and from then on holds whatever Settings ->
      # HTTPS Certificate has installed - see app/user_auth.py.
      - tls-shared:/app/tls
      # Alternative to the Settings page: bind-mount your own cert/key
      # directly instead (files must be named server.crt/server.key) - do
      # NOT use this at the same time as the line above, since only one
      # mount can occupy /app/tls:
      # - ./operations-manager/tls:/app/tls:ro
    healthcheck:
      # Tries HTTPS first (the default), then plain HTTP, so this works
      # whether or not DISABLE_TLS is set - see the Dockerfile's own
      # HEALTHCHECK for why -k is safe here (loopback, not an untrusted network).
      test: ["CMD-SHELL", "curl -kfs https://localhost:8090/api/health || curl -fs http://localhost:8090/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ---------------------------------------------------------------------
  # Admin dashboard - React + TypeScript + Vite, built and served by nginx.
  # nginx proxies /v1/* and /api/* through to the operations-manager so the UI
  # only ever needs to know about its own origin.
  # ---------------------------------------------------------------------
  ui:
    build:
      context: ./ui
    container_name: agent-operations-ui
    restart: unless-stopped
    depends_on:
      operations-manager:
        condition: service_healthy
    ports:
      # Serves HTTPS on 443 (self-signed by default, baked into the image -
      # see ui/Dockerfile), published on the standard HTTPS host port so
      # the dashboard is just https://localhost with no port number. Plain
      # HTTP still exists inside the container (nginx.conf.template
      # redirects it to HTTPS); publish it too - e.g. add "80:80" here -
      # if you want that redirect reachable from the host as well.
      - "443:443"
    environment:
      OPERATIONS_MANAGER_UPSTREAM: operations-manager:8090
      # Must match operations-manager's own TLS state (see DISABLE_TLS
      # above) - this is what scheme nginx uses for its own proxy hop to it.
      OPERATIONS_MANAGER_SCHEME: ${OPERATIONS_MANAGER_SCHEME:-https}
    volumes:
      # Same shared volume as operations-manager's /app/tls above - one
      # certificate installed via Settings -> HTTPS Certificate applies to
      # both services. Alternative: bind-mount your own cert/key instead
      # (files must be named server.crt/server.key), but not both at once:
      #   volumes:
      #     - ./ui/tls:/etc/nginx/tls:ro
      - tls-shared:/etc/nginx/tls

volumes:
  couchbase-data:
  hf-cache:
  tls-shared:
